# fail2ban filter for refused client certificates on the TeddyCloud box port.
#
# TeddyCloud logs one line per request on the box port whose client certificate
# is missing, unknown or not the pinned one of the box, for example:
#   WARN |server.c:0625:httpServerRequestCallback| Box port: client certificate refused from 203.0.113.7

# The line must start with the tag of the request code, so that request data
# logged elsewhere (headers, addresses) can not fake a refused certificate.

[Definition]
failregex = ^(?:(?:\S+ )?\S+: |\{"log":")?\S*WARN\s*\S*\|\S*server\.c:\d+:httpServerRequestCallback\S*\| Box port: client certificate refused from <HOST>
ignoreregex =

# The TeddyCloud log lines have no time stamp of their own. With the systemd
# journal or docker logs, fail2ban takes the time from there; for a plain log
# file the time of reading is used.
datepattern = {NONE}
