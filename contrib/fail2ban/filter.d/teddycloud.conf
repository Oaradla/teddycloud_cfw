# fail2ban filter for failed TeddyCloud web UI logins.
#
# TeddyCloud logs one line per failed login (wrong password, unknown user,
# wrong 2FA code, ...), for example:
#   WARN |handler_web_auth.c:1031:login_register_failure_unlocked| Web UI login failed for user 'admin' from 203.0.113.7 (wrong password)
#
# Behind a reverse proxy the address is the real client only if the proxy is
# listed in the setting web_auth.trusted_proxies.

[Definition]
failregex = Web UI login failed for user '[^']*' from <HOST> \(
ignoreregex =

# The TeddyCloud log lines have no time stamp of their own. With the systemd
# journal or docker logs, fail2ban takes the time from there; for a plain log
# file the time of reading is used.
datepattern = {NONE}
