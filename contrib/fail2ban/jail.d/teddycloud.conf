# Example jails for TeddyCloud, copy to /etc/fail2ban/jail.d/ and enable one.
# The filter is contrib/fail2ban/filter.d/teddycloud.conf (copy to /etc/fail2ban/filter.d/).
#
# TeddyCloud locks addresses itself as well (web_auth.lockout_attempts / lockout_minutes);
# fail2ban additionally blocks them in the firewall, also for the box port.

# TeddyCloud as systemd service
[teddycloud]
enabled  = false
filter   = teddycloud
backend  = systemd
journalmatch = _SYSTEMD_UNIT=teddycloud.service
maxretry = 5
findtime = 10m
bantime  = 1h
# the ports of core.server.http_port, https_api_port and https_web_port (defaults 80, 443, 8443);
# a reverse proxy on another port: list all ports the clients use
port     = http,https,8443

# TeddyCloud in docker: docker writes the container log as JSON lines
[teddycloud-docker]
enabled  = false
filter   = teddycloud
logpath  = /var/lib/docker/containers/*/*-json.log
datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%S
maxretry = 5
findtime = 10m
bantime  = 1h
# the published host ports, as in the jail above
port     = http,https,8443
# published container ports pass the DOCKER-USER chain, not INPUT
chain    = DOCKER-USER
